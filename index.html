<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 Cita de cumpleeee 🤍</title>

<style>
body {
  font-family: 'Arial', sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #e1eaff, #d2dcfa);
  padding: 20px;
}

h1 {
  color: #335ed6;
  margin-bottom: 20px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin: 15px auto;
  max-width: 340px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  display: none;
}

.card img {
  max-width: 100%;
  border-radius: 10px;
  margin-bottom: 10px;
  display: none;
  opacity: 0;
  transition: opacity 0.8s ease-in;
}

button {
  padding: 12px 25px;
  font-size: 16px;
  border: none;
  border-radius: 12px;
  background: #2448eb;
  color: white;
  cursor: pointer;
  transition: background 0.3s;
  margin-top: 10px;
}

button:hover {
  background: #a52b4d;
}

.emoji {
  font-size: 24px;
  margin-bottom: 10px;
}

.line {
  opacity: 1;
  display: block;
  margin-bottom: 5px;
}

.typed {
  display: inline;
  border-right: 2px solid #d6336c;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

/* FOTO FINAL CENTRADA */
#foto-final {
  display: block;
  margin: 20px auto;
  max-width: 200%;
  border-radius: 15px;
}

/* GLOBOS */
#globos-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
}

.globo {
  position: absolute;
  bottom: -100px;
  width: 40px;
  height: 55px;
  border-radius: 50%;
  animation: subir 6s linear infinite;
}

/* cuerda */
.globo::after {
  content: "";
  position: absolute;
  width: 2px;
  height: 20px;
  background: #555;
  left: 50%;
  top: 100%;
  transform: translateX(-50%);
}

@keyframes subir {
  0% {
    transform: translateY(0);
  }
  100% {
    transform: translateY(-120vh);
  }
}
</style>
</head>

<body>

<h1>🎉 Olaaa amooorrr 🤍</h1>
<h2>¿Quieres saber ya nuestros planes por tu cumpleaños?</h2>

<div id="boton-inicial">
  <button onclick="mostrarPaso(1)">¡Sii soy chismoso y quiero saber!</button>
</div>

<div id="contenedor">

<!-- Paso 1 -->
<div class="card" id="paso1">
  <h2>Primera parada</h2>
  <p class="line" data-text="Tu ya te lo esperas porque prácticamente te hice spoiler 😒"></p>
  <p class="line" data-text="Así que sí… nuestra primera parada es el Santiago Bernabéu."></p>
  <div class="emoji">⚽</div>
  <img src="entrada-bernabeu.jpg" alt="Entrada Bernabéu" data-delay="800">
  <button onclick="mostrarPaso(2)">Siguiente</button>
</div>

<!-- Paso 2 -->
<div class="card" id="paso2">
  <div class="emoji">🍽️</div>
  <h2>Segunda parada</h2>
  <p class="line" data-text="Después de estar alguna hora metidos allí siendo felices"></p>
  <p class="line" data-text="(tú por ver todo lo que haya dentro y yo por verte feliz a ti)"></p>
  <p class="line" data-text="Proseguimos con nuestra segunda parada."></p>
  <p class="line" data-text="Con tanta felicidad entra hambre… aunque claro tu chofer personal (yo)"></p>
  <p class="line" data-text="tendrá que conducir un poco lejos. Tenemos reserva en:"></p>
  <img src="restaurante.jpg" alt="Restaurante" data-delay="800">
  <p class="line" data-text="Como en todas nuestras citas tiene que haber algo improvisado,"></p>
  <p class="line" data-text="después de la comida elegiremos algún plan… porque si ya he elegido yo mucho"></p>
  <p class="line" data-text="y solita que luego te quejas🤨"></p>
  <button onclick="mostrarPaso(3)">Siguiente</button>
</div>

<!-- Paso 3 -->
<div class="card" id="paso3">
  <h2>Última parada</h2>
  <p class="line" data-text="Y como cierre perfecto… no nos vamos a casa todavía, pasaremos la noche juntitos en"></p>
  <p class="line" data-text="un hotel para comernos la cena y postre 😏❤️"></p>
  <img src="hotel.jpg" alt="Hotel" data-delay="800">
  <button onclick="mostrarPaso(4)">Siguiente</button>
</div>

<!-- Paso 4 -->
<div class="card" id="paso4">
  <h2>Instrucciones finales🤍</h2>
  <p class="line" data-text="Bueno amorcito, con esto quiero decirte que vas a necesitar dos outfits para el sábado"></p>
  <p class="line" data-text="Claramente tu camiseta del Madrid es uno de ellos⚽🤍"></p>
  <p class="line" data-text="Y pedirte que aunque sea por un día que seas puntual"></p>
  <p class="line" data-text="Así que hasta el sábado a las 13:40… "></p>
  <p class="line" data-text="te amooooo 😍"></p> 
  <button onclick="mostrarPaso(5); iniciarGlobos();">Final</button>
</div>

<!-- Paso 5 (FUERA correctamente) -->
<div class="card" id="paso5">
  <h2>❤️</h2>
  <img src="nosotros.png" alt="Nosotros" id="foto-final" style="display:block; opacity:1;">
  <div id="globos-container"></div>
</div>

</div>

<script>
function typeLine(element, text, callback) {
  let i = 0;
  element.innerHTML = '';
  element.classList.add('typed');
  
  function type() {
    if(i < text.length) {
      element.innerHTML += text.charAt(i);
      i++;
      setTimeout(type, 30);
    } else {
      element.classList.remove('typed');
      if(callback) callback();
    }
  }
  type();
}

function mostrarPaso(n) {
  if(n === 1) document.getElementById('boton-inicial').style.display = 'none';

  const pasoActual = document.getElementById('paso' + n);
  pasoActual.style.display = 'block';

  const lineas = pasoActual.querySelectorAll('.line');
  let index = 0;

  function mostrarSiguienteLinea() {
    if(index < lineas.length) {
      typeLine(lineas[index], lineas[index].dataset.text, () => {
        index++;
        mostrarSiguienteLinea();
      });
    } else {
      const imagenes = pasoActual.querySelectorAll('img');
      imagenes.forEach(img => {
        let delay = img.dataset.delay ? parseInt(img.dataset.delay) : 500;
        setTimeout(() => {
          img.style.display = 'block';
          img.style.opacity = 1;
        }, delay);
      });
    }
  }

  mostrarSiguienteLinea();
}

/* GLOBOS */
function crearGlobo() {
  const globo = document.createElement("div");
  globo.classList.add("globo");

  globo.style.left = Math.random() * 100 + "vw";

  const colores = ["#ff4d6d", "#ff85a1", "#ffc2d1", "#ffd6a5"];
  globo.style.background = colores[Math.floor(Math.random() * colores.length)];

  document.getElementById("globos-container").appendChild(globo);

  setTimeout(() => {
    globo.remove();
  }, 6000);
}

function iniciarGlobos() {
  setInterval(crearGlobo, 400);
}
</script>

</body>
</html>
